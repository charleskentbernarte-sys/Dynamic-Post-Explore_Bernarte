<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="masthead">
    <p class="masthead__kicker">JSONPlaceholder &middot; live fetch, no reload</p>
    <h1>Post Explorer</h1>
    <p class="masthead__note">
      Click the button and the first five posts load right into this page, no reload needed!
    </p>
    <button id="load-btn" class="button" type="button">Load posts</button>
  </header>

  <main>
    <!-- Live region: screen readers announce loading, errors and results -->
    <div id="status" class="status" role="status" aria-live="polite"></div>

    <section id="posts" class="posts" aria-label="Fetched posts"></section>
  </main>

  <footer class="colophon">
    <p>Week 7 &mdash; Fetch API &amp; Asynchronous Data</p>
    <p>Made by Charles Bernarte</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
